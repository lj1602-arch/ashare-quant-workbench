name: A-share rotation refresh
on:
  schedule:
    # UTC -> Beijing 09:00, 11:00, 14:00, 15:00 on weekdays
    - cron: '0 1,3,6,7 * * 1-5'
    # After-close verification retries at Beijing 15:20 and 15:45
    - cron: '20,45 7 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ashare-refresh
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Generate quant data
        run: python main.py
      - name: Verify refreshed output and model version
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          data=json.loads(Path('docs/data.json').read_text(encoding='utf-8'))
          assert data.get('model_version')=='v2.4-dynamic-rotation', 'V2.3 model did not run'
          assert len(data.get('stocks', []))>0, 'No stocks generated'
          dt=datetime.fromisoformat(data['updated_at_beijing'])
          assert dt.tzinfo and 0<=(datetime.now(timezone.utc)-dt.astimezone(timezone.utc)).total_seconds()<900,'Output timestamp stale'
          for s in data['stocks']:
              if s.get('bar_status')=='provisional_quote':
                  assert s.get('trade_eligible') is False, 'Provisional bar incorrectly trade eligible'
          print('Verified V2.4 stocks',len(data['stocks']))
          PY
      - name: Commit data if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data.json docs/rotation_history.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: update verified A-share rotation signals'
            git push
          fi
